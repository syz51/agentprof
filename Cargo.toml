[package]
name = "agentprof"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Profile coding-agent sessions (Claude Code, Codex, T3 Code): time, tokens, cost and wasteful patterns"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = "line-tables-only"
