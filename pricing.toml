# API list prices used for agentprof's API-equivalent cost estimates.
#
# Prices are USD per million tokens at the standard tier. A model missing here
# gets cost "unknown"; never add a row without an official source.
#
# Classes map to agentprof token classes:
#   input          uncached input tokens
#   cache_write_5m Anthropic 5-minute cache writes
#   cache_write_1h Anthropic 1-hour cache writes
#   cache_read     cache hits (Anthropic) / cached input (OpenAI)
#   output         output tokens, including reasoning/thinking tokens
#
# long_context: a request whose prompt (uncached input + cache writes + cache
# reads) exceeds `threshold_tokens` is priced with the long-context rates.
#
# context_window (Claude rows only) is the documented maximum context, used by
# the near-context-window rule. Source: each model's page under
# https://platform.claude.com/docs/en/about-claude/models/overview (checked
# 2026-11-07). Codex sessions use the window recorded in their own rollouts.
schema = "agentprof.pricing/1"

[[model]]
provider = "anthropic"
model = "claude-opus-5-5"
input = 4.00
cache_write_5m = 5.00
cache_write_1h = 8.00
cache_read = 0.20
output = 20.00
context_window = 1000000
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-07"
notes = "Global inference. inference_geo=us applies 1.1x (applied per request). Fast mode ($8/$40) is not priced here: fast requests are unpriced."

